<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="KisanGuard — Simple Smart Farm Irrigation Login for Farmers.">
<title>Sign In — KisanGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=20">
<style>
body {
  background: linear-gradient(135deg, rgba(244, 247, 242, 0.92), rgba(234, 245, 228, 0.94)), url('assets/farm_hero_bg.jpg') center/cover fixed no-repeat;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.login-page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: var(--bg-white);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(27, 94, 32, 0.15), 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid var(--border-light);
}

.login-header {
  background: linear-gradient(135deg, rgba(20, 60, 24, 0.92) 0%, rgba(46, 125, 50, 0.86) 100%), url('assets/farm_hero_bg.jpg') center/cover no-repeat;
  padding: 34px 24px;
  text-align: center;
  color: #FFFFFF;
  position: relative;
}

.login-icon-box {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  font-size: 28px;
  border: 2px solid rgba(255,255,255,0.3);
}

.login-body {
  padding: 24px;
}

.farmer-lang-login {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <!-- Hero Header -->
    <div class="login-header">
      <div class="login-icon-box">🌾</div>
      <h1 style="font-size:24px; font-weight:900; letter-spacing:-0.02em;" id="loginTitle">KisanGuard</h1>
      <p style="font-size:13.5px; opacity:0.9; margin-top:4px; font-weight:600;" id="loginSub">Smart Farm Irrigation &amp; Motor Protection</p>
    </div>

    <!-- Login Form Body -->
    <div class="login-body">

      <!-- 3-Language Selector on Login Screen -->
      <div class="farmer-lang-login" id="loginLangBar">
        <div class="farmer-lang-group" style="background:#E8F5E9; border-color:#C8E6C9;">
          <button class="lang-pill" id="btnLangEn" onclick="setLang('en')" style="color:#1B5E20;">English</button>
          <button class="lang-pill" id="btnLangHi" onclick="setLang('hi')" style="color:#1B5E20;">हिंदी</button>
          <button class="lang-pill" id="btnLangMr" onclick="setLang('mr')" style="color:#1B5E20;">मराठी</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div>
          <label style="display:block; font-size:12.5px; font-weight:800; color:var(--text-dark); margin-bottom:6px;" id="lblFarmerName">Farmer Name</label>
          <input type="text" id="inputName" class="input" placeholder="e.g. Samir" value="Samir" style="width:100%; font-size:15px; font-weight:700;">
        </div>

        <div>
          <label style="display:block; font-size:12.5px; font-weight:800; color:var(--text-dark); margin-bottom:6px;" id="lblMobile">Mobile Number</label>
          <input type="tel" id="inputMobile" class="input" placeholder="9876543210" value="9876543210" style="width:100%; font-size:15px; font-weight:700;">
        </div>

        <button class="farmer-power-btn is-start" style="margin-top:8px; font-size:17px;" onclick="handleLogin()" id="btnEnterFarm">
          🌾 Enter My Farm
        </button>
      </div>

    </div>

  </div>
</div>

<script src="js/app.js?v=20"></script>
<script>
  redirectIfAuthed('home.html');

  const curLang = getLanguage();
  document.getElementById('btnLangEn').className = `lang-pill ${curLang === 'en' ? 'active' : ''}`;
  document.getElementById('btnLangHi').className = `lang-pill ${curLang === 'hi' ? 'active' : ''}`;
  document.getElementById('btnLangMr').className = `lang-pill ${curLang === 'mr' ? 'active' : ''}`;

  function setLang(l) {
    setLanguage(l);
  }

  // Multi-Language on Login Page
  const loginTranslations = {
    en: {
      sub: 'Smart Farm Motor Control & Timer',
      name: 'Farmer Name',
      mobile: 'Mobile Number',
      btn: '🌾 Enter My Farm'
    },
    hi: {
      sub: 'स्मार्ट खेत मोटर नियंत्रण और टाइमर',
      name: 'किसान का नाम',
      mobile: 'मोबाइल नंबर',
      btn: '🌾 खेत में प्रवेश करें'
    },
    mr: {
      sub: 'स्मार्ट शेती मोटर नियंत्रण व टाइमर',
      name: 'शेतकऱ्याचे नाव',
      mobile: 'मोबाईल नंबर',
      btn: '🌾 शेतात प्रवेश करा'
    }
  };

  const tr = loginTranslations[curLang] || loginTranslations['en'];
  document.getElementById('loginSub').textContent = tr.sub;
  document.getElementById('lblFarmerName').textContent = tr.name;
  document.getElementById('lblMobile').textContent = tr.mobile;
  document.getElementById('btnEnterFarm').textContent = tr.btn;

  function handleLogin() {
    const name = document.getElementById('inputName').value.trim() || 'Farmer';
    const mobile = document.getElementById('inputMobile').value.trim() || '9876543210';
    saveAuth({ name, mobile, loggedInAt: Date.now() });
    toast('Welcome to KisanGuard! 🌾', 'success');
    setTimeout(() => {
      window.location.replace('home.html');
    }, 300);
  }
</script>
</body>
</html>
