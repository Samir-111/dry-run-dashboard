<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="KisanGuard — Smart Farm Irrigation Dashboard for Farmers.">
<title>Farmer Setup — KisanGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=26">
<style>
body {
  background: linear-gradient(135deg, rgba(244, 247, 242, 0.94), rgba(234, 245, 228, 0.96)), url('assets/farm_hero_bg.jpg') center/cover fixed no-repeat;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.login-page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 40px;
}

.login-box {
  width: 100%;
  max-width: 440px;
  background: var(--bg-white);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(27, 94, 32, 0.18), 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  animation: fadeInBox 0.3s ease-out;
}

@keyframes fadeInBox {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-header {
  background: linear-gradient(135deg, rgba(20, 60, 24, 0.94) 0%, rgba(46, 125, 50, 0.88) 100%), url('assets/farm_hero_bg.jpg') center/cover no-repeat;
  padding: 30px 20px 24px;
  text-align: center;
  color: #FFFFFF;
  position: relative;
}

.login-icon-box {
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-size: 28px;
  border: 2px solid rgba(255,255,255,0.35);
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}

.login-body {
  padding: 22px 24px 28px;
}

.farmer-lang-login {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 20px;
}

.auth-form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.auth-label {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  gap: 6px;
}

.auth-input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: #FAFCF9;
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 700;
  color: var(--text-dark);
  outline: none;
  transition: all 0.2s ease;
}

.auth-input:focus {
  border-color: var(--green);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
}

.farmer-profile-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: #F4F8F3;
  border: 2px solid #DDEBD9;
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: 12px;
  color: inherit;
}

.farmer-profile-card:hover {
  background: #E8F5E9;
  border-color: var(--green);
  transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <!-- Hero Header -->
    <div class="login-header">
      <div class="login-icon-box">🌾</div>
      <h1 style="font-size:24px; font-weight:900; letter-spacing:-0.02em;" id="loginTitle">KisanGuard</h1>
      <p style="font-size:13.5px; opacity:0.92; margin-top:3px; font-weight:600;" id="loginSub">Smart Farm Irrigation &amp; Motor Protection</p>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- 3-Language Selector -->
      <div class="farmer-lang-login" id="loginLangBar">
        <div class="farmer-lang-group" style="background:#E8F5E9; border-color:#C8E6C9;">
          <button class="lang-pill" id="btnLangEn" onclick="changeLang('en')" style="color:#1B5E20;">English</button>
          <button class="lang-pill" id="btnLangHi" onclick="changeLang('hi')" style="color:#1B5E20;">हिंदी</button>
          <button class="lang-pill" id="btnLangMr" onclick="changeLang('mr')" style="color:#1B5E20;">मराठी</button>
        </div>
      </div>

      <!-- VIEW 1: First-Time Setup Form -->
      <div id="firstTimeSetupView">
        <div style="text-align:center; margin-bottom:18px;">
          <h3 style="font-size:16.5px; font-weight:900; color:var(--text-dark);" id="lblSetupHeading">🌾 Farmer Registration</h3>
          <p style="font-size:12.5px; color:var(--text-muted); margin-top:2px;" id="lblSetupSub">Enter your details once to start controlling your farm motor</p>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="farmerNameInput" id="lblFarmerName">👤 Farmer Name</label>
          <input type="text" id="farmerNameInput" class="auth-input" placeholder="e.g. Ramesh Patel">
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="farmerMobileInput" id="lblMobileNumber">📱 Mobile Number</label>
          <input type="tel" id="farmerMobileInput" class="auth-input" placeholder="e.g. 9876543210" maxlength="10">
        </div>

        <button class="farmer-power-btn is-start" style="margin-top:16px; font-size:16.5px;" onclick="handleSaveFarmerProfile()" id="btnSaveEnter">
          🌾 Enter My Farm
        </button>
      </div>

      <!-- VIEW 2: Returning Farmer Selector (Shows only if already saved) -->
      <div id="returningFarmerView" style="display:none;">
        <div style="text-align:center; margin-bottom:16px;">
          <h3 style="font-size:16px; font-weight:900; color:var(--text-dark);" id="lblWelcomeBack">🌾 Welcome Back</h3>
          <p style="font-size:12.5px; color:var(--text-muted); margin-top:2px;" id="lblReturningSub">Tap to open your farm dashboard</p>
        </div>

        <div id="savedFarmersList"></div>

        <button class="farmer-power-btn is-start" style="margin-top:10px; font-size:15px; background:#4CAF50;" onclick="showFirstTimeView()" id="btnAddProfile">
          ➕ Register Another Member
        </button>
      </div>

    </div>
  </div>
</div>

<script src="js/app.js?v=26"></script>
<script>
  redirectIfAuthed('home.html');

  const setupI18n = {
    en: {
      sub: 'Smart Farm Irrigation & Motor Protection',
      heading: '🌾 Farmer Registration',
      setupSub: 'Enter your details once to start controlling your farm motor',
      name: '👤 Farmer Name',
      namePlaceholder: 'e.g. Ramesh Patel',
      mobile: '📱 Mobile Number',
      mobilePlaceholder: 'e.g. 9876543210',
      btnEnter: '🌾 Enter My Farm',
      welcomeBack: '🌾 Welcome Back',
      returningSub: 'Tap to open your farm dashboard',
      toastSuccess: 'Profile saved! Welcome to KisanGuard 🌾',
      toastNameErr: 'Please enter your name.',
      toastMobileErr: 'Please enter a valid 10-digit mobile number.'
    },
    hi: {
      sub: 'स्मार्ट खेत मोटर नियंत्रण और सुरक्षा',
      heading: '🌾 किसान पंजीकरण',
      setupSub: 'मोटर नियंत्रण शुरू करने के लिए अपना विवरण दर्ज करें',
      name: '👤 किसान का नाम',
      namePlaceholder: 'जैसे: रमेश पटेल',
      mobile: '📱 मोबाइल नंबर',
      mobilePlaceholder: 'जैसे: 9876543210',
      btnEnter: '🌾 खेत में प्रवेश करें',
      welcomeBack: '🌾 पुनः स्वागत है',
      returningSub: 'खेत डैशबोर्ड खोलने के लिए टैप करें',
      toastSuccess: 'प्रोफाइल सेव हो गया! किसानगार्ड में आपका स्वागत है 🌾',
      toastNameErr: 'कृपया अपना नाम दर्ज करें।',
      toastMobileErr: 'कृपया १० अंकों का वैध मोबाइल नंबर दर्ज करें।'
    },
    mr: {
      sub: 'स्मार्ट शेती मोटर नियंत्रण व सुरक्षा',
      heading: '🌾 शेतकरी नोंदणी',
      setupSub: 'मोटर नियंत्रण सुरू करण्यासाठी आपली माहिती प्रविष्ट करा',
      name: '👤 शेतकऱ्याचे नाव',
      namePlaceholder: 'उदा: रमेश पाटील',
      mobile: '📱 मोबाईल नंबर',
      mobilePlaceholder: 'उदा: 9876543210',
      btnEnter: '🌾 शेतात प्रवेश करा',
      welcomeBack: '🌾 पुन्हा स्वागत आहे',
      returningSub: 'शेती डॅशबोर्ड उघडण्यासाठी टॅप करा',
      toastSuccess: 'माहिती सेव्ह झाली! किसानगार्ड मध्ये आपले स्वागत आहे 🌾',
      toastNameErr: 'कृपया आपले नाव टाका.',
      toastMobileErr: 'कृपया १० अंकी वैध मोबाईल नंबर टाका.'
    }
  };

  function updateTranslations() {
    const curLang = getLanguage();
    document.getElementById('btnLangEn').className = `lang-pill ${curLang === 'en' ? 'active' : ''}`;
    document.getElementById('btnLangHi').className = `lang-pill ${curLang === 'hi' ? 'active' : ''}`;
    document.getElementById('btnLangMr').className = `lang-pill ${curLang === 'mr' ? 'active' : ''}`;

    const tr = setupI18n[curLang] || setupI18n['en'];
    document.getElementById('loginSub').textContent = tr.sub;
    document.getElementById('lblSetupHeading').textContent = tr.heading;
    document.getElementById('lblSetupSub').textContent = tr.setupSub;
    document.getElementById('lblFarmerName').textContent = tr.name;
    document.getElementById('farmerNameInput').placeholder = tr.namePlaceholder;
    document.getElementById('lblMobileNumber').textContent = tr.mobile;
    document.getElementById('farmerMobileInput').placeholder = tr.mobilePlaceholder;
    document.getElementById('btnSaveEnter').textContent = tr.btnEnter;
    document.getElementById('lblWelcomeBack').textContent = tr.welcomeBack;
    document.getElementById('lblReturningSub').textContent = tr.returningSub;
  }

  function changeLang(l) {
    setLanguage(l);
  }

  function showFirstTimeView() {
    document.getElementById('firstTimeSetupView').style.display = 'block';
    document.getElementById('returningFarmerView').style.display = 'none';
  }

  async function checkInitialConfig() {
    try {
      const res = await fetch('/api/auth/config');
      const data = await res.json();
      if (data && data.users && data.users.length > 0) {
        renderSavedFarmers(data.users);
      } else {
        showFirstTimeView();
      }
    } catch (e) {
      showFirstTimeView();
    }
  }

  function renderSavedFarmers(users) {
    document.getElementById('firstTimeSetupView').style.display = 'none';
    document.getElementById('returningFarmerView').style.display = 'block';

    const listEl = document.getElementById('savedFarmersList');
    listEl.innerHTML = users.map(u => `
      <div class="farmer-profile-card" onclick="enterAsFarmer('${u.name}', '${u.mobile}')">
        <div style="font-size:26px;">👨‍🌾</div>
        <div style="flex:1;">
          <div style="font-size:16px; font-weight:900; color:var(--text-dark);">${u.name}</div>
          <div style="font-size:12.5px; color:var(--green-dark); font-weight:700;">📱 +91 ${u.mobile}</div>
        </div>
        <span style="font-size:18px; color:var(--green); font-weight:900;">➔</span>
      </div>
    `).join('');
  }

  function enterAsFarmer(name, mobile) {
    saveAuth({ name, mobile, loggedInAt: Date.now() });
    window.location.replace('home.html');
  }

  async function handleSaveFarmerProfile() {
    const name = document.getElementById('farmerNameInput').value.trim();
    const mobile = document.getElementById('farmerMobileInput').value.trim().replace(/\D/g, '');
    const curLang = getLanguage();
    const tr = setupI18n[curLang] || setupI18n['en'];

    if (!name) {
      toast(tr.toastNameErr, 'error');
      return;
    }
    if (!mobile || mobile.length < 10) {
      toast(tr.toastMobileErr, 'error');
      return;
    }

    try {
      await fetch('/api/auth/register-initial', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user1: { name, mobile, password: 'nopassword' },
          user2: { name: 'Family Member', mobile: mobile, password: 'nopassword' },
          recoveryPin: '1234'
        })
      });
    } catch (e) {}

    saveAuth({ name, mobile, loggedInAt: Date.now() });
    toast(tr.toastSuccess, 'success');
    setTimeout(() => {
      window.location.replace('home.html');
    }, 300);
  }

  updateTranslations();
  checkInitialConfig();
</script>
</body>
</html>
