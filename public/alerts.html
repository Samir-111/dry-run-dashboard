<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="KisanGuard — Farm Alerts & Safety Logs.">
<title>Alerts — KisanGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<!-- Top Header Bar -->
<header class="top-header">
  <div class="top-header-inner">
    <a href="home.html" class="top-brand">
      <div class="top-brand-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <span class="top-brand-name" id="brandTitle">KisanGuard</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-nav" id="desktopNav"></div>

    <div class="top-actions">
      <!-- 3-Language Switcher (English | हिंदी | मराठी) -->
      <div id="langSwitcher"></div>
      <button class="btn-header" onclick="handleClear()" id="clearBtn">Clear</button>
      <button class="btn-header" onclick="doLogout()" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<!-- Main Page Container -->
<main class="page-container">

  <!-- Summary -->
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:15px; font-weight:800; color:var(--text-dark);" id="alertsSub">
      All systems normal ✓
    </div>
  </div>

  <!-- Notification & Siren Sound Toggle Controls -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
    <button class="btn btn-green" id="notifBtn" onclick="handleEnableNotif()" style="padding:12px 14px; font-size:13px; font-weight:800;">
      🔔 <span id="notifBtnText">Push Notifications</span>
    </button>
    <button class="btn btn-outline" id="sirenBtn" onclick="toggleSirenSetting()" style="padding:12px 14px; font-size:13px; font-weight:800;">
      🔊 <span id="sirenBtnText">Siren Alarm ON</span>
    </button>
  </div>

  <!-- Alert Events List -->
  <div id="alertsList" style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
    <!-- Dynamically populated with farmer-friendly alert cards -->
  </div>

</main>

<!-- Bottom Mobile Navigation Bar -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/app.js?v=21"></script>
<script>
  requireAuth();
  injectNav('alerts');

  document.getElementById('brandTitle').textContent = t('brand');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('clearBtn').textContent = 'Clear';

  function updateNotifButton() {
    const btn = document.getElementById('notifBtn');
    const txt = document.getElementById('notifBtnText');
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      btn.className = 'btn btn-outline';
      txt.textContent = `${t('pushNotif')} (Active)`;
    } else {
      btn.className = 'btn btn-green';
      txt.textContent = `Enable ${t('pushNotif')}`;
    }

    const sirenBtn = document.getElementById('sirenBtn');
    const sirenTxt = document.getElementById('sirenBtnText');
    const enabled = localStorage.getItem('sirenEnabled') !== '0';
    if (enabled) {
      sirenBtn.className = 'btn btn-green';
      sirenTxt.textContent = t('sirenOn');
    } else {
      sirenBtn.className = 'btn btn-outline';
      sirenTxt.textContent = t('sirenOff');
    }
  }

  function toggleSirenSetting() {
    const cur = localStorage.getItem('sirenEnabled') !== '0';
    localStorage.setItem('sirenEnabled', cur ? '0' : '1');
    toast(cur ? t('sirenOff') : t('sirenOn'), cur ? 'info' : 'success');
    updateNotifButton();
  }

  function handleEnableNotif() {
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(() => updateNotifButton());
  }

  function renderAlerts() {
    const alerts = loadAlerts();
    const container = document.getElementById('alertsList');
    const subEl = document.getElementById('alertsSub');

    if (alerts.length === 0) {
      subEl.textContent = t('allClear');
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:36px 20px;">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#2E7D32" stroke-width="2.2" style="margin:0 auto 12px; display:block;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div style="font-size:16px; font-weight:800; color:var(--text-dark);">${t('allClear')}</div>
          <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">No safety alerts logged.</div>
        </div>`;
      return;
    }

    subEl.textContent = `${alerts.length} Event${alerts.length > 1 ? 's' : ''}`;
    container.innerHTML = alerts.map(a => {
      const time = a.time ? new Date(a.time).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
      return `
        <div class="card" style="padding:16px 18px; border-left:4px solid #D32F2F;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:11px; font-weight:800; background:#FFEBEE; color:#D32F2F; padding:3px 8px; border-radius:12px;">ALERT</span>
              <span style="font-size:15px; font-weight:800; color:var(--text-dark);">${t('dryRunTitle')}</span>
            </div>
            <span style="font-size:11.5px; font-weight:600; color:var(--text-muted);">${time}</span>
          </div>
          <div style="font-size:13px; color:var(--text-sec); font-weight:600;">${t('dryRunMsg')}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${t('dryRunSub')}</div>
        </div>`;
    }).join('');
  }

  function handleClear() {
    clearAlerts();
    toast('Alerts cleared ✓');
    renderAlerts();
  }

  updateNotifButton();
  renderAlerts();
  startPolling(() => renderAlerts());
</script>
</body>
</html>
