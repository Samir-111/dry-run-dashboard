<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="KisanGuard — Motor Usage & Activity History.">
<title>Usage & History — KisanGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<!-- Top Header Bar -->
<header class="top-header">
  <div class="top-header-inner">
    <a href="home.html" class="top-brand">
      <div class="top-brand-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <span class="top-brand-name" id="brandTitle">KisanGuard</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-nav" id="desktopNav"></div>

    <div class="top-actions">
      <!-- 3-Language Switcher (English | हिंदी | मराठी) -->
      <div id="langSwitcher"></div>
      <button class="btn-header" onclick="doLogout()" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<!-- Main Page Container -->
<main class="page-container">

  <!-- Summary Cards Grid -->
  <div class="stat-grid">

    <div class="stat-tile">
      <div class="stat-tile-header">
        <span class="stat-tile-label" id="lblTodayWater">Today's Motor Runtime</span>
        <div class="stat-tile-icon" style="background:#E8F5E9; color:#2E7D32;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
      </div>
      <div class="stat-tile-value" id="dashTodayONVal" style="color:#2E7D32;">0m</div>
      <div class="stat-tile-hint" id="hintTodayWater">Total for today</div>
    </div>

    <div class="stat-tile">
      <div class="stat-tile-header">
        <span class="stat-tile-label" id="lblActiveSession">Current Motor Runtime</span>
        <div class="stat-tile-icon" style="background:#FFF8E1; color:#F57F17;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
      </div>
      <div class="stat-tile-value" id="dashActiveSessionVal" style="color:#F57F17; font-family:'Nunito',monospace;">00:00:00</div>
      <div class="stat-tile-hint" id="hintActiveSession">Current run duration</div>
    </div>

    <div class="stat-tile">
      <div class="stat-tile-header">
        <span class="stat-tile-label" id="lblThisMonth">This Month Total</span>
        <div class="stat-tile-icon" style="background:#E1F5FE; color:#0288D1;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
      </div>
      <div class="stat-tile-value" id="dashMonthONVal" style="color:#0288D1;">0m</div>
      <div class="stat-tile-hint" id="hintMonthWater">Last 30 days</div>
    </div>

    <div class="stat-tile">
      <div class="stat-tile-header">
        <span class="stat-tile-label" id="lblSysStatus">System Status</span>
        <div class="stat-tile-icon" style="background:#E8F5E9; color:#2E7D32;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
      </div>
      <div class="stat-tile-value" id="dashSysStatusVal" style="font-size:16px;">—</div>
      <div class="stat-tile-hint" id="hintSysStatus">Connection health</div>
    </div>

  </div>

  <!-- Detailed Motor Activity History Card -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <div class="card-title" style="margin-bottom:0;">
        <div class="card-title-icon" style="background:#FFF8E1; color:#F57F17;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <span id="titleHistoryLog">Motor Activity History</span>
      </div>
      <a href="/api/export-csv" download class="btn btn-green" style="padding:7px 16px; font-size:12.5px; gap:6px;" id="btnExportCsv">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download History (CSV)
      </a>
    </div>

    <div style="overflow-x:auto;">
      <table class="clean-table" id="sessionsTable">
        <thead>
          <tr>
            <th id="thDate">Date</th>
            <th id="thStart">Start Time</th>
            <th id="thStop">Stop Time</th>
            <th id="thDuration">Duration</th>
            <th id="thReason">Status / Reason</th>
          </tr>
        </thead>
        <tbody id="sessionsTableBody">
          <tr>
            <td colspan="5" style="text-align:center; padding:24px; color:var(--text-muted);" id="txtLoadingSessions">Loading watering sessions…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- Bottom Mobile Navigation Bar -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/app.js?v=21"></script>
<script>
  requireAuth();
  injectNav('dashboard');

  document.getElementById('brandTitle').textContent = t('brand');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('lblTodayWater').textContent = t('todayWateringTime');
  document.getElementById('lblActiveSession').textContent = t('activeSessionTime');
  document.getElementById('lblThisMonth').textContent = `${t('thisMonth')} Total`;
  document.getElementById('lblSysStatus').textContent = 'System Status';
  document.getElementById('titleHistoryLog').textContent = t('activityHistory');
  document.getElementById('btnExportCsv').textContent = t('exportHistory');
  document.getElementById('thDate').textContent = 'Date';
  document.getElementById('thStart').textContent = 'Start Time';
  document.getElementById('thStop').textContent = 'Stop Time';
  document.getElementById('thDuration').textContent = 'Duration';
  document.getElementById('thReason').textContent = 'Status';

  let localSessionMs = 0;
  let localTodayMs = 0;
  let currentState = {};

  startPolling((state, reachable, live) => {
    currentState = state;
    const isRunning = pumpIsRunning(state);

    const sysVal = document.getElementById('dashSysStatusVal');
    if (live || isRunning) {
      sysVal.textContent = `🟢 ${t('systemOnline')}`;
      sysVal.style.color = '#2E7D32';
    } else {
      sysVal.textContent = `🔴 ${t('systemOffline')}`;
      sysVal.style.color = '#D32F2F';
    }

    const rStats = state.runtimeStats || {};
    localSessionMs = rStats.currentSessionMs || 0;
    localTodayMs = rStats.todayTotalMs || 0;

    document.getElementById('dashActiveSessionVal').textContent = live && isRunning ? formatDurationMs(localSessionMs, true) : '00:00:00';
    document.getElementById('dashTodayONVal').textContent = formatDurationMs(localTodayMs, false);
    document.getElementById('dashMonthONVal').textContent = formatDurationMs(rStats.monthTotalMs || localTodayMs * 12, false);
  });

  // 1-second ticker
  setInterval(() => {
    if (pumpIsRunning(currentState)) {
      localSessionMs += 1000;
      localTodayMs += 1000;
      document.getElementById('dashActiveSessionVal').textContent = formatDurationMs(localSessionMs, true);
      document.getElementById('dashTodayONVal').textContent = formatDurationMs(localTodayMs, false);
    }
  }, 1000);

  // Render Clean Activity Table
  async function renderSessionsTable() {
    const tbody = document.getElementById('sessionsTableBody');
    const data = await fetchSessions(50);
    if (!data || !data.sessions || data.sessions.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-muted);">${t('noActivityYet')}</td></tr>`;
      return;
    }

    let rows = '';
    data.sessions.forEach(s => {
      const date = new Date(s.startTime).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const startTime = new Date(s.startTime).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      const stopTime = s.stopTime ? new Date(s.stopTime).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';
      const durationFormatted = formatDurationMs(s.durationMs || 0, false);
      const rawReason = s.stopReason || 'User Stop';

      let reasonText = `💧 ${t('stopped')}`;
      let reasonClass = 'user-stop';
      if (rawReason.includes('Timer')) {
        reasonText = `⏱️ ${t('stoppedTimer')}`;
        reasonClass = 'timer-off';
      } else if (rawReason.includes('Fault') || rawReason.includes('Lockout') || rawReason.includes('Dry') || rawReason.includes('Water')) {
        reasonText = `⚠️ ${t('stoppedWaterRanOut')}`;
        reasonClass = 'fault-trip';
      }

      rows += `
        <tr>
          <td style="font-weight:700; color:var(--text-dark);">${date}</td>
          <td>${startTime}</td>
          <td>${stopTime}</td>
          <td style="font-weight:900; color:#2E7D32;">${durationFormatted}</td>
          <td><span class="badge-reason ${reasonClass}">${reasonText}</span></td>
        </tr>`;
    });

    tbody.innerHTML = rows;
  }

  renderSessionsTable();
  setInterval(renderSessionsTable, 6000);
</script>
</body>
</html>
