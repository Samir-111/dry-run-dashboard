<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<meta name="description" content="KisanGuard — Farm Details & Farmer Settings.">
<title>Farm & Settings — KisanGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<!-- Top Header Bar -->
<header class="top-header">
  <div class="top-header-inner">
    <a href="home.html" class="top-brand">
      <div class="top-brand-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22V8"/><path d="M12 18c-2-1-4-1-5 1"/><path d="M12 18c2-1 4-1 5 1"/><path d="M12 14c-2.5-1.5-5-1.5-6 1"/></svg>
      </div>
      <span class="top-brand-name" id="brandTitle">KisanGuard</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-nav" id="desktopNav"></div>

    <div class="top-actions">
      <!-- 3-Language Switcher (English | हिंदी | मराठी) -->
      <div id="langSwitcher"></div>
      <button class="btn-header" onclick="doLogout()" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<!-- Main Page Container -->
<main class="page-container">

  <div class="grid-two-col">

    <!-- Farmer Profile & Farm Info Card -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-icon" style="background:#E8F5E9; color:#2E7D32;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </div>
        <span id="titleFarmerProfile">Farmer & Farm Profile</span>
      </div>

      <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:12px; background:var(--bg); border-radius:14px; border:1px solid var(--border-light);">
        <div style="width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg, #2E7D32, #66BB6A); color:#FFFFFF; font-size:24px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(46,125,50,0.3);">🌾</div>
        <div style="flex:1;">
          <div style="font-size:17px; font-weight:900; color:var(--text-dark);" id="profileFarmerName">Farmer</div>
          <div style="font-size:13px; color:var(--text-sec);" id="profilePhone">Smart Motor Controller</div>
        </div>
        <span class="sys-status-ribbon is-online" style="font-size:11px; padding:3px 10px;">ACTIVE</span>
      </div>

      <div class="info-list">
        <div class="info-row">
          <div class="info-label" id="lblMotorControl">Motor Control</div>
          <div class="info-value" style="color:#2E7D32;" id="valMotorControl">Ready ✓</div>
        </div>
        <div class="info-row">
          <div class="info-label" id="lblAutoOffFeature">Auto-Off Timer</div>
          <div class="info-value" id="valAutoOffFeature">Active</div>
        </div>
        <div class="info-row">
          <div class="info-label" id="lblSystemHealth">System Health</div>
          <div class="info-value" style="color:#2E7D32;" id="valSystemHealth">Normal ✓</div>
        </div>
      </div>
    </div>

    <!-- Alert Phone Number Settings -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-icon" style="background:#FFEBEE; color:#D32F2F;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <span id="titleAlertMobile">SMS Alert Phone Number</span>
      </div>

      <p style="font-size:13px; color:var(--text-sec); margin-bottom:14px;" id="descAlertMobile">
        Important motor status and timer notifications will be sent to this mobile number.
      </p>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="display:block; font-size:12px; font-weight:800; color:var(--text-dark); margin-bottom:6px;" id="lblInputMobile">Farmer Mobile Number</label>
          <input type="tel" id="alertMobileInput" class="input" placeholder="e.g. 9876543210" style="width:100%; font-size:15px; font-weight:700;">
        </div>

        <button class="btn btn-green" id="btnSaveMobile" onclick="handleSaveMobile()" style="padding:14px; font-size:14px; font-weight:800;">
          Save Settings
        </button>
      </div>
    </div>

  </div>

</main>

<!-- Bottom Mobile Navigation Bar -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/app.js?v=21"></script>
<script>
  requireAuth();
  injectNav('profile');

  document.getElementById('brandTitle').textContent = t('brand');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('titleFarmerProfile').textContent = `${t('myFarm')} & Farmer Profile`;
  document.getElementById('titleAlertMobile').textContent = t('alertMobile');
  document.getElementById('btnSaveMobile').textContent = t('saveSettings');

  const auth = loadAuth();
  const name = (auth && auth.name) ? auth.name : 'Farmer';
  const phone = (auth && auth.phone) ? auth.phone : 'Smart Motor Controller';
  document.getElementById('profileFarmerName').textContent = `${name}`;
  document.getElementById('profilePhone').textContent = `📱 ${phone}`;

  async function loadMobile() {
    const data = await fetchAlertContact();
    if (data && data.mobile) {
      document.getElementById('alertMobileInput').value = data.mobile;
    }
  }

  async function handleSaveMobile() {
    const num = document.getElementById('alertMobileInput').value.trim();
    if (!num) {
      toast('Please enter mobile number', 'error');
      return;
    }
    try {
      await postAlertContact(num);
      toast(t('settingsSaved'), 'success');
    } catch (err) {
      toast(err.message || 'Failed', 'error');
    }
  }

  loadMobile();
</script>
</body>
</html>
